[project]
name = "backend"
version = "0.1.0"
description = "FastAPI Backend for Maths DD"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.115.0",
    "firebase-admin>=7.0.0",
    "cryptography>=43.0.0",
    "google-cloud-storage>=2.18.0",
    "greenlet>=3.1.0",
    "httpx>=0.28.0",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "tzdata>=2026.6",
    "upstash-redis>=1.8.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.2.0",
]

[tool.uv]
native-tls = true
